# Common configurations
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}
  RUSTFS__HOST: rustfs
  RUSTFS__PORT: 9000
  STRUCTURE_HTTPS_ENABLED: ${STRUCTURE_HTTPS_ENABLED:-false}
  STRUCTURE_DOMAIN: ${STRUCTURE_DOMAIN:-}

services:
  # Backend: API + event worker + celery worker + MCP (all-in-one)
  backend:
    profiles:
      - app
      - all
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        UV_VERSION: ${UV_VERSION:-0.5.24}
    image: structure-service:${VERSION:-latest}
    ports:
      - "${EXPOSE_PORT_STRUCTURE_PY:-8000}:8000"
      - "${EXPOSE_PORT_MCP:-9090}:9000"
    volumes:
      - structure-logs:/app/logs
      - structure-context-data:/app/data/context
    env_file:
      - ../.env
    environment:
      <<: *common-env
      RELOAD: ${RELOAD:-false}
      APP_PORT: 8000
      STRUCTURE_APP_PORT: 8000
      APP_HOST: 0.0.0.0
      APP_NAME: ${APP_NAME:-Structure}
      DEBUG: ${DEBUG:-false}
      ENV: ${ENV:-production}
      START_MCP: ${START_MCP:-true}
      START_CELERY: ${START_CELERY:-true}
      STRUCTURE_MCP_PORT: 9000
      STRUCTURE_MCP_HOST: 0.0.0.0
      POSTGRES__HOST: postgres
      POSTGRES__PORT: 5432
      POSTGRES__USERNAME: ${POSTGRES__USERNAME:-postgres}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD:?Set POSTGRES__PASSWORD in .env}
      POSTGRES__STRUCTURE_DBNAME: ${POSTGRES__STRUCTURE_DBNAME:-structure}
      POSTGRES__DRIVER: postgresql+asyncpg
      REDIS__HOST: redis
      REDIS__PORT: 6379
      REDIS__PASSWORD: ${REDIS__PASSWORD:?Set REDIS__PASSWORD in .env}
      REDIS__DB: ${REDIS__DB:-1}
      REDIS__USERNAME: ${REDIS__USERNAME:-}
      AUTH__JWT_SECRET_KEY: ${AUTH__JWT_SECRET_KEY:?Set AUTH__JWT_SECRET_KEY in .env}
      AUTH__JWT_ALGORITHM: ${AUTH__JWT_ALGORITHM:-HS256}
      AUTH__ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH__ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH__REFRESH_TOKEN_EXPIRE_DAYS: ${AUTH__REFRESH_TOKEN_EXPIRE_DAYS:-7}
      AUTH__ADMIN_USERNAME: ${AUTH__ADMIN_USERNAME:-admin}
      AUTH__ADMIN_PASSWORD: ${AUTH__ADMIN_PASSWORD:?Set AUTH__ADMIN_PASSWORD in .env}
      CONTEXT_SERVICE_DATA_ROOT: /app/data/context
      MALLOC_ARENA_MAX: "2"
      EMBED_WORKER: ${EMBED_WORKER:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - structure-network
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-1400M}
        reservations:
          memory: ${BACKEND_MEMORY_RESERVATION:-512M}

  # One-shot container: imports all inner tools from the MCP server on startup
  tool-initializer:
    profiles:
      - app
      - all
    image: python:3-alpine
    volumes:
      - ./init_builtin_tools.py:/init_builtin_tools.py:ro
    command: ["python", "/init_builtin_tools.py"]
    environment:
      <<: *common-env
      API_URL: http://backend:8000
      MCP_URL: http://backend:9000
      MCP_SSE_PATH: /mcp
      ADMIN_USERNAME: ${AUTH__ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${AUTH__ADMIN_PASSWORD:?Set AUTH__ADMIN_PASSWORD in .env}
      WAIT_TIMEOUT: "120"
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    networks:
      - structure-network

  # Celery Beat for scheduled tasks (optional)
  celery-beat:
    profiles:
      - celery-beat
      - all
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        UV_VERSION: ${UV_VERSION:-0.5.24}
    image: structure-service:${VERSION:-latest}
    command: celery -A structure.celery_worker.celery_app beat --loglevel=info
    volumes:
      - structure-logs:/app/logs
    env_file:
      - ../.env
    environment:
      <<: *common-env
      SKIP_MIGRATIONS: "true"
      # Database Configuration - PostgreSQL
      POSTGRES__HOST: postgres
      POSTGRES__PORT: 5432
      POSTGRES__USERNAME: ${POSTGRES__USERNAME:-postgres}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD:?Set POSTGRES__PASSWORD in .env}
      POSTGRES__STRUCTURE_DBNAME: ${POSTGRES__STRUCTURE_DBNAME:-structure}
      POSTGRES__DRIVER: postgresql+asyncpg
      # Redis Configuration
      REDIS__HOST: redis
      REDIS__PORT: 6379
      REDIS__PASSWORD: ${REDIS__PASSWORD:?Set REDIS__PASSWORD in .env}
      REDIS__DB: ${REDIS__DB:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    logging: *default-logging
    networks:
      - structure-network
    deploy:
      resources:
        limits:
          memory: ${CELERY_BEAT_MEMORY_LIMIT:-256M}
        reservations:
          memory: ${CELERY_BEAT_MEMORY_RESERVATION:-64M}

  # Flower - Celery monitoring (optional)
  flower:
    profiles:
      - flower
      - tools
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        UV_VERSION: ${UV_VERSION:-0.5.24}
    image: structure-service:${VERSION:-latest}
    command: celery -A structure.celery_worker.celery_app flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    env_file:
      - ../.env
    environment:
      <<: *common-env
      SKIP_MIGRATIONS: "true"
      # Database Configuration - PostgreSQL
      POSTGRES__HOST: postgres
      POSTGRES__PORT: 5432
      POSTGRES__USERNAME: ${POSTGRES__USERNAME:-postgres}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD:?Set POSTGRES__PASSWORD in .env}
      POSTGRES__STRUCTURE_DBNAME: ${POSTGRES__STRUCTURE_DBNAME:-structure}
      POSTGRES__DRIVER: postgresql+asyncpg
      # Redis Configuration
      REDIS__HOST: redis
      REDIS__PORT: 6379
      REDIS__PASSWORD: ${REDIS__PASSWORD:-}
      REDIS__DB: ${REDIS__DB:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - structure-network
    deploy:
      resources:
        limits:
          memory: ${FLOWER_MEMORY_LIMIT:-256M}
        reservations:
          memory: ${FLOWER_MEMORY_RESERVATION:-64M}

  # Frontend application (React + Vite)
  frontend:
    profiles:
      - frontend
      - app
      - all
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Structure}
        STRUCTURE_HTTPS_ENABLED: ${STRUCTURE_HTTPS_ENABLED:-false}
        STRUCTURE_DOMAIN: ${STRUCTURE_DOMAIN:-}
    image: structure-frontend:${VERSION:-latest}
    ports:
      - "${FRONTEND_EXPOSE_PORT:-80}:80"
    volumes:
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      <<: *common-env
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - structure-network
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-128M}
        reservations:
          memory: ${FRONTEND_MEMORY_RESERVATION:-32M}

  # PostgreSQL Database with pgvector
  postgres:
    profiles:
      - postgres
      - db_session
      - infra
      - all
    image: pgvector/pgvector:pg15
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-64MB}
      -c work_mem=${POSTGRES_WORK_MEM:-4MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-32MB}
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-20}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-128MB}
      -c wal_buffers=${POSTGRES_WAL_BUFFERS:-4MB}
    ports:
      - "${EXPOSE_PORT_POSTGRES:-5432}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      <<: *common-env
      POSTGRES_DB: ${POSTGRES__STRUCTURE_DBNAME:-structure}
      POSTGRES_USER: ${POSTGRES__USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:?Set POSTGRES__PASSWORD in .env}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USERNAME:-postgres} -d ${POSTGRES__STRUCTURE_DBNAME:-structure}"]
    restart: unless-stopped
    logging: *default-logging
    networks:
      - structure-network
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-256M}
        reservations:
          memory: ${POSTGRES_MEMORY_RESERVATION:-128M}


  
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    profiles:
      - storage
      - infra
      - all
    ports:
      - "${RUSTFS_EXPOSE_API:-9000}:9000"
      - "${RUSTFS_EXPOSE_CONSOLE:-9001}:9001"
    
    env_file:
      - ../.env
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS__ACCESS_KEY:?Set RUSTFS__ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS__SECRET_KEY:?Set RUSTFS__SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-true}
    user: "0:0"
    volumes:
      - ./rustfs/data:/data
      - ./rustfs/logs:/logs
    networks:
      - structure-network

  # Redis Cache
  redis:
    profiles:
      - redis
      - infra
      - all
    image: redis:7-alpine
    env_file:
      - ../.env
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --maxmemory
      - ${REDIS_MAXMEMORY:-100mb}
      - --requirepass
      - ${REDIS__PASSWORD:?Set REDIS__PASSWORD in .env}
    ports:
      - "${EXPOSE_PORT_REDIS:-6379}:6379"
    volumes:
      - ./redis/data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      <<: *common-env
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD:?Set REDIS__PASSWORD in .env}", "--no-auth-warning", "ping"]
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - structure-network
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-150M}
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION:-64M}

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles:
      - redis-commander
      - tools
      - all
    container_name: redis-commander
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    environment:
      <<: *common-env
      REDIS_HOSTS: local:redis:6379:0:${REDIS__PASSWORD:?Set REDIS__PASSWORD in .env}
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:?Set REDIS_COMMANDER_PASSWORD in .env}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - structure-network
    deploy:
      resources:
        limits:
          memory: ${REDIS_COMMANDER_MEMORY_LIMIT:-256M}
        reservations:
          memory: ${REDIS_COMMANDER_MEMORY_RESERVATION:-64M}

  # Context Service (standalone mode — optional)
  # Context storage is now handled in-process by the backend.
  # This container is kept for standalone/debugging use only.
  context-service:
    profiles:
      - context-service-standalone
    build:
      context: ..
      dockerfile: docker/Dockerfile.context-service
    image: structure-context-service:${VERSION:-latest}
    ports:
      - "${EXPOSE_PORT_CONTEXT_SERVICE:-8080}:8080"
    volumes:
      - structure-context-data:/app/data/context
    environment:
      <<: *common-env
    restart: unless-stopped
    logging: *default-logging
    networks:
      - structure-network

networks:
  structure-network:
    driver: bridge
    name: structure-network

volumes:
  structure-logs:
    driver: local
  structure-context-data:
    driver: local
