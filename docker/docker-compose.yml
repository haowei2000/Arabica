# Common configurations
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}
  RUSTFS__HOST: rustfs
  RUSTFS__PORT: 9000

services:
  # Main application service (API)
  app:
    profiles:
      - app
      - all
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        UV_VERSION: ${UV_VERSION:-0.5.24}
    image: aiwen-service:${VERSION:-latest}
    ports:
      - "${EXPOSE_PORT_AIWEN_PY:-8000}:8000"
    volumes:
      - structure-logs:/app/logs
      # Uncomment for development to mount source code
      # - ./src:/app/src:ro
    env_file:
      - .env
    environment:
      <<: *common-env
      # Service Configuration
      RELOAD: ${RELOAD:-false}
      APP_PORT: 8000
      APP_HOST: 0.0.0.0
      APP_NAME: ${APP_NAME:-Modular FastAPI App}
      DEBUG: ${DEBUG:-false}
      ENV: ${ENV:-production}
      # Database Configuration - PostgreSQL
      POSTGRES__HOST: postgres
      POSTGRES__PORT: 5432
      POSTGRES__USERNAME: ${POSTGRES__USERNAME:-postgres}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD:-123456}
      POSTGRES__AIWEN_DBNAME: ${POSTGRES__AIWEN_DBNAME:-struture}
      POSTGRES__DRIVER: postgresql+asyncpg
      # Redis Configuration
      REDIS__HOST: redis
      REDIS__PORT: 6379
      REDIS__PASSWORD: ${REDIS__PASSWORD:-123456}
      REDIS__DB: ${REDIS_DB:-1}
      REDIS__USERNAME: ${REDIS__USERNAME:-}
      # Authentication
      AUTH__JWT_SECRET_KEY: ${AUTH__JWT_SECRET_KEY:-your-super-secret-jwt-key-here-change-in-production}
      AUTH__JWT_ALGORITHM: ${AUTH__JWT_ALGORITHM:-HS256}
      AUTH__ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH__ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH__REFRESH_TOKEN_EXPIRE_MINUTES: ${AUTH__REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      AUTH__ADMIN_USERNAME: ${AUTH__ADMIN_USERNAME:-admin}
      AUTH__ADMIN_PASSWORD: ${AUTH__ADMIN_PASSWORD:-123456}
      # External Services
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      OLLAMA__HOST: ollama
      OLLAMA__PORT: 11434
      OLLAMA__PROTOCOL: http
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aiwen-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # MCP Server for Model Context Protocol
  mcp-server:
    profiles:
      - mcp
      - app
      - all
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        UV_VERSION: ${UV_VERSION:-0.5.24}
    image: aiwen-service:${VERSION:-latest}
    command: ["structure-mcp"]
    ports:
      - "9090:9000"
    volumes:
      - structure-logs:/app/logs
    env_file:
      - .env
    environment:
      <<: *common-env
      SKIP_MIGRATIONS: "true"
      AIWEN_MCP_PORT: 9000
      AIWEN_MCP_HOST: 0.0.0.0
      # Database Configuration - PostgreSQL
      POSTGRES__HOST: postgres
      POSTGRES__PORT: 5432
      POSTGRES__USERNAME: ${POSTGRES__USERNAME:-postgres}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD:-123456}
      POSTGRES__AIWEN_DBNAME: ${POSTGRES__AIWEN_DBNAME:-struture}
      POSTGRES__DRIVER: postgresql+asyncpg
      # Redis Configuration
      REDIS__HOST: redis
      REDIS__PORT: 6379
      REDIS__PASSWORD: ${REDIS__PASSWORD:-123456}
      REDIS__DB: ${REDIS_DB:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aiwen-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
  
  # One-shot container: imports all inner tools from the MCP server on startup
  tool-initializer:
    profiles:
      - app
      - all
    image: python:3-alpine
    volumes:
      - ./init_builtin_tools.py:/init_builtin_tools.py:ro
    command: ["python", "/init_builtin_tools.py"]
    environment:
      <<: *common-env
      API_URL: http://app:8000
      MCP_URL: http://mcp-server:9000
      MCP_SSE_PATH: /mcp
      ADMIN_USERNAME: ${AUTH__ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${AUTH__ADMIN_PASSWORD:-123456}
      WAIT_TIMEOUT: "120"
    depends_on:
      app:
        condition: service_healthy
      mcp-server:
        condition: service_started
    restart: "no"
    networks:
      - aiwen-network

  # Celery Worker for background tasks
  celery-worker:
    profiles:
      - celery
      - worker
      - all
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        UV_VERSION: ${UV_VERSION:-0.5.24}
    image: aiwen-service:${VERSION:-latest}
    command: celery -A structure.celery_worker.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - structure-logs:/app/logs
    env_file:
      - .env
    environment:
      <<: *common-env
      SKIP_MIGRATIONS: "true"
      # Database Configuration - PostgreSQL
      POSTGRES__HOST: postgres
      POSTGRES__PORT: 5432
      POSTGRES__USERNAME: ${POSTGRES__USER:-postgres}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD:-123456}
      POSTGRES__AIWEN_DBNAME: ${POSTGRES__AIWEN_DBNAME:-structure}
      POSTGRES__DRIVER: postgresql+asyncpg
      # Redis Configuration
      REDIS__HOST: redis
      REDIS__PORT: 6379
      REDIS__PASSWORD: ${REDIS__PASSWORD:-123456}
      REDIS__DB: ${REDIS_DB:-1}
      REDIS__USERNAME: ${REDIS__USERNAME:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aiwen-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
  
  # Celery Beat for scheduled tasks (optional)
  celery-beat:
    profiles:
      - celery-beat
      - all
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        UV_VERSION: ${UV_VERSION:-0.5.24}
    image: aiwen-service:${VERSION:-latest}
    command: celery -A structure.celery_worker.celery_app beat --loglevel=info
    volumes:
      - structure-logs:/app/logs
    env_file:
      - .env
    environment:
      <<: *common-env
      SKIP_MIGRATIONS: "true"
      # Database Configuration - PostgreSQL
      POSTGRES__HOST: postgres
      POSTGRES__PORT: 5432
      POSTGRES__USERNAME: ${POSTGRES__USER:-postgres}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD:-123456}
      POSTGRES__AIWEN_DBNAME: ${POSTGRES__AIWEN_DBNAME:-structure}
      POSTGRES__DRIVER: postgresql+asyncpg
      # Redis Configuration
      REDIS__HOST: redis
      REDIS__PORT: 6379
      REDIS__PASSWORD: ${REDIS__PASSWORD:-123456}
      REDIS__DB: ${REDIS_DB:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aiwen-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
  
  # Flower - Celery monitoring (optional)
  flower:
    profiles:
      - flower
      - tools
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        UV_VERSION: ${UV_VERSION:-0.5.24}
    image: aiwen-service:${VERSION:-latest}
    command: celery -A structure.celery_worker.celery_app flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    env_file:
      - .env
    environment:
      <<: *common-env
      SKIP_MIGRATIONS: "true"
      # Database Configuration - PostgreSQL
      POSTGRES__HOST: postgres
      POSTGRES__PORT: 5432
      POSTGRES__USERNAME: ${POSTGRES__USER:-postgres}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD:-123456}
      POSTGRES__AIWEN_DBNAME: ${POSTGRES__AIWEN_DBNAME:-structure}
      POSTGRES__DRIVER: postgresql+asyncpg
      # Redis Configuration
      REDIS__HOST: redis
      REDIS__PORT: 6379
      REDIS__PASSWORD: ${REDIS__PASSWORD:-}
      REDIS__DB: ${REDIS_DB:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aiwen-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
  
  # Frontend application (React + Vite)
  frontend:
    profiles:
      - frontend
      - app
      - all
    env_file:
      - .env
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Aiwen}
    image: aiwen-frontend:${VERSION:-latest}
    ports:
      - "${FRONTEND_EXPOSE_PORT:-3000}:80"
    volumes:
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      <<: *common-env
    depends_on:
      app:
        condition: service_started
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aiwen-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # PostgreSQL Database with pgvector
  postgres:
    profiles:
      - postgres
      - db_session
      - infra
      - all
    image: pgvector/pgvector:pg15
    ports:
      - "${EXPOSE_PORT_POSTGRES:-5432}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      <<: *common-env
      POSTGRES_DB: ${POSTGRES__AIWEN_DBNAME:-struture}
      POSTGRES_USER: ${POSTGRES__USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:-123456}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USER:-postgres} -d ${POSTGRES__AIWEN_DBNAME:-structure}"]
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aiwen-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M


  
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    profiles:
      - storage
      - infra
      - all
    ports:
      - "${RUSTFS_EXPOSE_API:-9000}:9000"
      - "${RUSTFS_EXPOSE_CONSOLE:-9001}:9001"
    
    env_file:
      - .env
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS__ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS__SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-true}
    user: "0:0"
    volumes:
      - ./rustfs/data:/data
      - ./rustfs/logs:/logs
    networks:
      - aiwen-network

  # Redis Cache
  redis:
    profiles:
      - redis
      - infra
      - all
    image: redis:7-alpine
    env_file:
      - .env
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    ports:
      - "${EXPOSE_PORT_REDIS:-6379}:6379"
    volumes:
      - ./redis/data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      <<: *common-env
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD:-123456}", "--no-auth-warning", "ping"]
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aiwen-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Ollama Service (for local LLM)
  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    ports:
      - "${EXPOSE_PORT_OLLAMA:-11434}:11434"
    volumes:
      - ./ollama-models:/root/.ollama
      - ./ollama:/app/ollama:ro
    environment:
      <<: *common-env
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_MODELS: /app/ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aiwen-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
          # Uncomment for GPU support
          # devices:
          #   - driver: nvidia
          #     count: all
          #     capabilities: [gpu]

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles:
      - redis-commander
      - tools
      - all
    container_name: redis-commander
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    environment:
      <<: *common-env
      REDIS_HOSTS: local:redis:6379:0:${REDIS__PASSWORD:-123456}
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-123456}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aiwen-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Context Service for file-based metadata
  context-service:
    profiles:
      - infra
      - all
    build:
      context: ..
      dockerfile: docker/Dockerfile.context-service
    image: aiwen-context-service:${VERSION:-latest}
    ports:
      - "${EXPOSE_PORT_CONTEXT_SERVICE:-8080}:8080"
    volumes:
      - structure-context-data:/app/data/context
    environment:
      <<: *common-env
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aiwen-network

networks:
  aiwen-network:
    driver: bridge
    name: structure-network

volumes:
  aiwen-logs:
    driver: local
  aiwen-context-data:
    driver: local
