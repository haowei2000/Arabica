# ============================================================================
# Optimized Docker Compose for AI630 Project
# Supports multi-architecture (amd64/arm64) automatically
# ============================================================================

services:
  aiwen:
    # ========================================================================
    # Build Configuration
    # ========================================================================
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION:-3.12}
        - UV_VERSION=${UV_VERSION:-0.5.24}
      # BuildKit cache configuration for faster rebuilds
      # Note: Registry cache disabled for local builds to avoid slow cache imports
      # cache_from:
      #   - type=registry,ref=${REGISTRY:-localhost}/aiwen-service:buildcache
      # Use BuildKit for better performance
      x-bake:
        tags:
          - ${REGISTRY:-localhost}/aiwen-service:${VERSION:-latest}
          - ${REGISTRY:-localhost}/aiwen-service:${BUILD_DATE:-dev}

    image: ${REGISTRY:-localhost}/aiwen-service:${VERSION:-latest}

    container_name: aiwen-service

    # ========================================================================
    # Network Configuration
    # ========================================================================
    ports:
      - "${AIWEN_PY_EXPOSE_PORT:-8000}:8000"
      - "${AIWEN_MCP_EXPOSE_PORT:-9000}:9000"

    # ========================================================================
    # Volume Mounts
    # ========================================================================
    volumes:
      # Logs directory
      - aiwen-logs:/app/logs
      # Optional: mount source code for development
      # - ../src:/app/src:ro

    # ========================================================================
    # Environment Configuration
    # ========================================================================
    env_file:
      - .env

    environment:
      # Service Configuration
      - RELOAD=${RELOAD:-false}
      - APP_PORT=${AIWEN_PY_PORT:-8000}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - MCP_PORT=${AIWEN_MCP_PORT:-9000}
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      - APP_NAME=${APP_NAME:-Modular FastAPI App}
      - DEBUG=${DEBUG:-false}
      - ENV=${ENV:-production}

      # Database Configuration - PostgreSQL
      - POSTGRES__HOST=${POSTGRES__HOST:-postgres}
      - POSTGRES__PORT=${POSTGRES__PORT:-5432}
      - POSTGRES__USERNAME=${POSTGRES__USERNAME:-postgres}
      - POSTGRES__PASSWORD=${POSTGRES__PASSWORD}
      - POSTGRES__AIWEN_DBNAME=${POSTGRES__AIWEN_DBNAME:-aiwen}
      - POSTGRES__DIFY_DBNAME=${POSTGRES__DIFY_DBNAME:-dify}
      - POSTGRES__DRIVER=${POSTGRES__DRIVER:-postgresql+asyncpg}

      # Database Configuration - MySQL
      - MYSQL__HOST=${MYSQL__HOST:-mysql}
      - MYSQL__PORT=${MYSQL__PORT:-3306}
      - MYSQL__USERNAME=${MYSQL__USERNAME:-root}
      - MYSQL__PASSWORD=${MYSQL__PASSWORD}
      - MYSQL__DBNAME=${MYSQL__DBNAME:-aiwen}
      - MYSQL__DRIVER=${MYSQL__DRIVER:-mysql+asyncmy}

      # Redis Configuration
      - REDIS__HOST=${REDIS__HOST:-redis}
      - REDIS__PORT=${REDIS__PORT:-6379}
      - REDIS__PASSWORD=${REDIS__PASSWORD}
      - REDIS__DB=${REDIS__DB:-1}
      - REDIS__USERNAME=${REDIS__USERNAME}

      # Authentication
      - AUTH__JWT_SECRET_KEY=${AUTH__JWT_SECRET_KEY}
      - AUTH__JWT_ALGORITHM=${AUTH__JWT_ALGORITHM:-HS256}
      - AUTH__ACCESS_TOKEN_EXPIRE_MINUTES=${AUTH__ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - AUTH__REFRESH_TOKEN_EXPIRE_MINUTES=${AUTH__REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      - AUTH__ADMIN_USERNAME=${AUTH__ADMIN_USERNAME:-admin}
      - AUTH__ADMIN_PASSWORD=${AUTH__ADMIN_PASSWORD}

      # External Services
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OLLAMA__HOST=${OLLAMA__HOST:-ollama}
      - OLLAMA__PORT=${OLLAMA__PORT:-11434}
      - OLLAMA__PROTOCOL=${OLLAMA__PROTOCOL:-http}

    # ========================================================================
    # Resource Limits
    # ========================================================================
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-2.0}'
          memory: ${MEMORY_LIMIT:-4G}
        reservations:
          cpus: '${CPU_RESERVATION:-0.5}'
          memory: ${MEMORY_RESERVATION:-1G}

    # ========================================================================
    # Health Check
    # ========================================================================
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # ========================================================================
    # Restart Policy
    # ========================================================================
    restart: unless-stopped

    # ========================================================================
    # Logging Configuration
    # ========================================================================
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=aiwen"

    # ========================================================================
    # Dependencies (uncomment if using docker-based databases)
    # ========================================================================
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy

    # ========================================================================
    # Networks
    # ========================================================================
    networks:
      - aiwen-network

