services:
  aiwen:
    build:
      context: ..
      dockerfile: docker/DockerfileArm
    ports:
      - "${AIWEN_PY_EXPOSE_PORT:-8000}:8000"
      - "${AIWEN_MCP_EXPOSE_PORT:-9035}:9000"
    volumes:
      - ../logs:/app/logs
    env_file:
      - .env
    environment:
      - RELOAD=${RELOAD:-false}
      - APP_PORT=${AIWEN_PY_PORT:-8000}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - MCP_PORT=${AIWEN_MCP_PORT:-9035}
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      - APP_NAME=${APP_NAME:-Modular FastAPI App}
      - DEBUG=${DEBUG:-false}
      - ENV=${ENV:-development}
      - POSTGRES__HOST=${POSTGRES__HOST:-10.1.2.111}
      - POSTGRES__PORT=${POSTGRES__PORT:-5435}
      - POSTGRES__USERNAME=${POSTGRES__USERNAME:-postgres}
      - POSTGRES__PASSWORD=${POSTGRES__PASSWORD:-difyai123456}
      - POSTGRES__AIWEN_DBNAME=${POSTGRES__AIWEN_DBNAME:-aiwen}
      - POSTGRES__DIFY_DBNAME=${POSTGRES__DIFY_DBNAME:-dify}
      - POSTGRES__DRIVER=${POSTGRES__DRIVER:-postgresql+asyncpg}
      - MYSQL__HOST=${MYSQL__HOST:-61.183.71.118}
      - MYSQL__PORT=${MYSQL__PORT:-9220}
      - MYSQL__USERNAME=${MYSQL__USERNAME:-root}
      - MYSQL__PASSWORD=${MYSQL__PASSWORD:-123456}
      - MYSQL__DBNAME=${MYSQL__DBNAME:-unimax55_5509_710}
      - MYSQL__DRIVER=${MYSQL__DRIVER:-mysql+asyncmy}
      - REDIS__HOST=${REDIS__HOST}
      - REDIS__PORT=${REDIS__PORT:-6379}
      - REDIS__PASSWORD=${REDIS__PASSWORD:-difyai123456}
      - REDIS__DB=${REDIS__DB:-1}
      - REDIS__USERNAME=${REDIS__USERNAME}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - AUTH__JWT_SECRET_KEY=${AUTH__JWT_SECRET_KEY:-your-super-secret-jwt-key-here-change-in-production}
      - AUTH__JWT_ALGORITHM=${AUTH__JWT_ALGORITHM:-HS256}
      - AUTH__ACCESS_TOKEN_EXPIRE_MINUTES=${AUTH__ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - AUTH__REFRESH_TOKEN_EXPIRE_DAYS=${AUTH__REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - AUTH__ADMIN_USERNAME=${AUTH__ADMIN_USERNAME:-admin}
      - AUTH__ADMIN_PASSWORD=${AUTH__ADMIN_PASSWORD:-admin123}
      - OLLAMA__HOST=${OLLAMA__HOST:-127.0.0.1}
      - OLLAMA__PORT=${OLLAMA__PORT:-11434}
      - OLLAMA__PROTOCOL=${OLLAMA__PROTOCOL:-http}
    restart: unless-stopped