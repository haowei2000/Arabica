[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiwen-service"
version = "5.5.0"
description = "Backend service for aiwen platform"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Epichust", email = "" }]
keywords = ["aiwen", "service", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    # Database & ORM
    "sqlalchemy>=2.0.44",
    "alembic>=1.17.2",
    "psycopg2-binary>=2.9.11",
    "asyncpg>=0.30.0",
    "pymysql>=1.1.2",
    "asyncmy>=0.2.10",
    "neo4j>=6.0.3",
    # Web Framework
    "fastapi>=0.121.1",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    # Configuration
    "pydantic-settings>=2.11.0",
    # LLM & AI
    "dashscope>=1.25.2",
    "langchain>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.1.0",
    "fastmcp>=2.13.1",
    # Utilities & Logging
    "structlog>=25.5.0",
    "python-json-logger>=4.0.0",
    "redis>=7.0.1",
    "py-key-value-aio[redis]>=0.2.8",
    "greenlet>=3.2.4",
    # Data Visualization
    "plotly>=6.5.0",
    "kaleido>=1.2.0",
    "ruff",
    "debugpy>=1.8.19",
    # file
    "python-docx", # Word文档处理
    "markdown",
    "python-multipart",
    "pypandoc>=1.16.2",
    "reportlab>=4.4.6",
    "sse-starlette>=3.0.3",
    "python-jose>=3.5.0",
    "bcrypt>=5.0.0",
    "langgraph>=1.0.4",
    "httpx[socks]>=0.28.1",
    "langgraph-checkpoint-postgres>=3.0.2",
    "jieba>=0.42.1",
    "fuzzywuzzy[speedup]>=0.18.0",
    "pypinyin>=0.55.0",
    "click>=8.1.0",
    "ty>=0.0.7",
    "pip>=25.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.14.7",
    "faker>=30.0.0",
    "ty>=0.0.7",
    "types-redis>=4.6.0",
]

[project.scripts]
# 统一服务管理（推荐使用）
aiwen = "aiwen.service_manager:main"
# 单独服务入口（保留向后兼容）
aiwen-api = "aiwen.api_cli:run"
aiwen-mcp = "aiwen.mcp_cli:main"
aiwen-worker = "aiwen.worker_cli:main_sync"
# 工具
sync-env = "scripts.sync_env:main"

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.hatch.build.targets.wheel]
packages = ["src/aiwen", "src/scripts"]

[tool.hatch.build.targets.sdist]
packages = ["src/aiwen", "src/scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "smoke: Smoke tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src/aiwen",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=60",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.coverage.run]
branch = true
source = ["src/aiwen"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
