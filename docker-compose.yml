version: '3.8'

services:
  # Main application service
  aiwen-app:
    profiles:
      - main-app
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION:-3.12}
        - UV_VERSION=${UV_VERSION:-0.5.24}
    image: aiwen-service:${VERSION:-latest}
    container_name: aiwen-app
    ports:
      - "${AIWEN_PY_EXPOSE_PORT:-8000}:8000"
      - "${AIWEN_MCP_EXPOSE_PORT:-9000}:9000"
    volumes:
      - aiwen-logs:/app/logs
      # Uncomment for development to mount source code
      # - ./src:/app/src:ro
    env_file:
      - .env
    environment:
      # Service Configuration
      - RELOAD=${RELOAD:-false}
      - APP_PORT=${AIWEN_PY_PORT:-8000}
      - APP_HOST=0.0.0.0
      - MCP_PORT=${AIWEN_MCP_PORT:-9000}
      - MCP_HOST=0.0.0.0
      - MCP_TRANSPORT=http
      - APP_NAME=${APP_NAME:-Modular FastAPI App}
      - DEBUG=${DEBUG:-false}
      - ENV=${ENV:-production}

      # Database Configuration - PostgreSQL
      - POSTGRES__HOST=postgres
      - POSTGRES__PORT=${POSTGRES_PORT:-5432}
      - POSTGRES__USERNAME=${POSTGRES_USER:-postgres}
      - POSTGRES__PASSWORD=${POSTGRES_PASSWORD:-aiwen123456}
      - POSTGRES__AIWEN_DBNAME=${POSTGRES_AIWEN_DBNAME:-aiwen}
      - POSTGRES__DIFY_DBNAME=${POSTGRES_DIFY_DBNAME:-dify}
      - POSTGRES__DRIVER=postgresql+asyncpg

      # Database Configuration - MySQL
      - MYSQL__HOST=mysql
      - MYSQL__PORT=${MYSQL_PORT:-3306}
      - MYSQL__USERNAME=${MYSQL_USER:-root}
      - MYSQL__PASSWORD=${MYSQL_PASSWORD:-aiwen123456}
      - MYSQL__DBNAME=${MYSQL_DBNAME:-aiwen}
      - MYSQL__DRIVER=mysql+asyncmy

      # Redis Configuration
      - REDIS__HOST=redis
      - REDIS__PORT=${REDIS_PORT:-6379}
      - REDIS__PASSWORD=${REDIS_PASSWORD}
      - REDIS__DB=${REDIS_DB:-1}
      - REDIS__USERNAME=${REDIS_USERNAME}

      # Authentication
      - AUTH__JWT_SECRET_KEY=${AUTH__JWT_SECRET_KEY:-your-super-secret-jwt-key-here-change-in-production}
      - AUTH__JWT_ALGORITHM=${AUTH__JWT_ALGORITHM:-HS256}
      - AUTH__ACCESS_TOKEN_EXPIRE_MINUTES=${AUTH__ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - AUTH__REFRESH_TOKEN_EXPIRE_MINUTES=${AUTH__REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      - AUTH__ADMIN_USERNAME=${AUTH__ADMIN_USERNAME:-admin}
      - AUTH__ADMIN_PASSWORD=${AUTH__ADMIN_PASSWORD:-admin123}

      # External Services
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OLLAMA__HOST=ollama
      - OLLAMA__PORT=${OLLAMA_PORT:-11434}
      - OLLAMA__PROTOCOL=http
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aiwen-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aiwen-postgres
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=${POSTGRES_AIWEN_DBNAME:-aiwen}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aiwen123456}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - aiwen-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: aiwen-mysql
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-aiwen123456}
      - MYSQL_DATABASE=${MYSQL_DBNAME:-aiwen}
      - MYSQL_USER=${MYSQL_USER:-aiwen}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-aiwen123456}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-aiwen}", "-p${MYSQL_PASSWORD:-aiwen123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - aiwen-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aiwen-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-aiwenredis123}
      --appendonly yes
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-aiwenredis123}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aiwenredis123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aiwen-network

  # Ollama Service (for local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: aiwen-ollama
    profiles:
      - ollama
    ports:
      - "${OLLAMA_EXPOSE_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
      - ./ollama:/app/ollama:ro
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/app/ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - aiwen-network
    deploy:
      resources:
        limits:
          # Uncomment the following lines if you have a GPU and want to use it
          # devices:
          #   - "gpu=all"
          memory: 4G
        reservations:
          memory: 1G

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles:
      - redis-commander
    container_name: aiwen-redis-commander
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=${REDIS_COMMANDER_USER:-admin}
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD:-admin123}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - aiwen-network

networks:
  aiwen-network:
    driver: bridge
    name: aiwen-network

volumes:
  aiwen-logs:
    driver: local
  postgres-data:
    driver: local
    name: aiwen-postgres-data
  mysql-data:
    driver: local
    name: aiwen-mysql-data
  redis-data:
    driver: local
    name: aiwen-redis-data
  ollama-models:
    driver: local
    name: aiwen-ollama-models