# ruff.toml（适用于 Ruff 0.6.0+，包括当前最新的 0.9.x）

target-version = "py312"        # 改成你的最低 Python 版本
line-length = 88
src = ["src", "tests", "scripts"]

# ==================== 格式化设置 ====================
[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ==================== 检查器设置 ====================
[lint]
select = [
    "E", "W", "F", "I", # 基础 + isort
    "UP", "B", "C4", "SIM", "TID", # 常用高质量规则
    "RET", "ARG", "PTH", "ERA", # 自动删除无用代码
    "RUF", # Ruff 自带规则
]

# 必须忽略的（避免和 ruff format 冲突）
ignore = [
    "E501", # 行长度交给 format
    "COM812", # trailing comma
    "ISC001", # 字符串拼接
    "RUF001",
    "RUF002",
    "RUF003",
    "F401", # 未使用的 import
]

# ==================== isort 设置 ====================
[lint.isort]
section-order = [
    "future", # __future__
    "standard-library", # import os, sys, pathlib...
    "third-party", # import django, fastapi, pydantic, requests...
    "first-party", # import ai630, my_project...
    "local-folder", # from .models import ... （相对导入）
]
known-first-party = ["app"]
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = true

# ==================== 文件忽略 ====================
[lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "ANN"]
"__init__.py" = ["F401", "F403"]
