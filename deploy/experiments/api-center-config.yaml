# Rendered by the official nginx image entrypoint. LONGCAT_API_KEY is injected
# only into the API-center Pod; it is never available to experiment Jobs.
server {
  listen 4000;
  server_name _;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Preserve the native OpenAI-compatible path and replace any client
  # credentials with the upstream LongCat bearer credential.
  location /openai/v1/ {
    proxy_pass https://api.longcat.chat;
    proxy_set_header Host api.longcat.chat;
    proxy_set_header Authorization "Bearer ${LONGCAT_API_KEY}";
    proxy_set_header x-api-key "";
    proxy_set_header Content-Type application/json;
    proxy_http_version 1.1;
  }
}
