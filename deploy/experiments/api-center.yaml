apiVersion: v1
kind: Secret
metadata:
  name: api-center-provider-credentials
  annotations:
    # Replace with the organization's 1Password Secret Operator item mapping.
    structure.dev/managed-by: 1password
type: Opaque
stringData:
  # Empty bootstrap value keeps the proxy health-checkable before the real
  # provider credential is injected by 1Password or the cluster operator.
  LONGCAT_API_KEY: "unconfigured"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-center
  labels:
    app.kubernetes.io/name: api-center
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-center
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-center
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: api-center-provider-credentials
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: generated-config
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
      volumes:
        - name: config
          configMap:
            name: api-center-config
        - name: generated-config
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-center
spec:
  selector:
    app.kubernetes.io/name: api-center
  ports:
    - name: http
      port: 4000
      targetPort: http
