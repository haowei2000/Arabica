apiVersion: v1
kind: ServiceAccount
metadata:
  name: experiment-runner
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: experiment-result-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: experiment-result-reader
subjects:
  - kind: ServiceAccount
    name: experiment-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: experiment-result-reader
