[package]
name = "arabica-adapters"
description = "Persistence adapters implementing arabica-session's observer/store ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
documentation = "https://docs.rs/arabica-adapters"
keywords = ["ai", "agent", "persistence"]
categories = ["development-tools"]
readme = "../../README.md"

[dependencies]
sha2.workspace = true
hex.workspace = true
rusqlite.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde = { workspace = true }
serde_json.workspace = true
arabica-runtime = { version = "0.5.0", path = "../arabica-runtime" }
arabica-protocol = { version = "0.5.0", path = "../arabica-protocol" }
arabica-session = { version = "0.5.0", path = "../arabica-session" }

[dev-dependencies]
arabica-model = { version = "0.5.0", path = "../arabica-model" }

[lints]
workspace = true
