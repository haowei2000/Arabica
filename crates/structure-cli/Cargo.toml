[package]
name = "arabica"
description = "Arabica: the Structure coding agent terminal host - fullscreen TUI chat, ACP for Zed, and one-shot runs"
keywords = ["ai", "agent", "tui", "cli", "llm"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "structure"
path = "src/main.rs"

[dependencies]
agent-client-protocol.workspace = true
rmcp.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rpassword = "7.5"
clap.workspace = true
crossterm = "0.29"
ignore.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "scrolling-regions", "unstable-rendered-line-info"] }
serde.workspace = true
similar.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
structure-adapters = { path = "../structure-adapters" }
structure-model = { path = "../structure-model" }
structure-protocol = { path = "../structure-protocol" }
structure-provider = { path = "../structure-provider" }
structure-runner = { path = "../structure-runner" }
structure-runtime = { path = "../structure-runtime" }
structure-session = { path = "../structure-session" }
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
