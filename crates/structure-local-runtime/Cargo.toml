[package]
name = "structure-local-runtime"
version = "5.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Embedded local agent runtime for Structure CLI, TUI, and desktop app"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
structure-local-core = { path = "../structure-local-core" }
