[package]
name = "arabica-runner-remote"
description = "Loop–Runner Protocol: remote runner client and runner host over WebSocket + mTLS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
documentation = "https://docs.rs/arabica-runner-remote"
keywords = ["ai", "agent", "tools", "remote"]
categories = ["development-tools"]
readme = "../../README.md"

[dependencies]
futures-util.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde_json.workspace = true
arabica-model = { version = "0.12.0", path = "../arabica-model" }
arabica-protocol = { version = "0.12.0", path = "../arabica-protocol" }
arabica-runner = { version = "0.12.0", path = "../arabica-runner" }
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
rcgen = "0.14"

[lints]
workspace = true
