[package]
name = "structure-local"
version = "5.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust local CLI and TUI for Structure"

[[bin]]
name = "structure-local"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
serde_json = "1"
structure-local-core = { path = "../structure-local-core" }
