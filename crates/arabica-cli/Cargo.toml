[package]
name = "arabica-cli"
description = "Arabica: a terminal coding agent with a fullscreen TUI, ACP support for Zed, and one-shot runs"
keywords = ["ai", "agent", "tui", "cli", "llm"]
categories = ["command-line-utilities", "development-tools"]
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/arabica-cli"

[[bin]]
name = "arabica"
path = "src/main.rs"

[dependencies]
agent-client-protocol.workspace = true
rmcp.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rpassword = "7.5"
clap.workspace = true
crossterm = "0.29"
ignore.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "scrolling-regions", "unstable-rendered-line-info"] }
serde.workspace = true
similar.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
arabica-adapters = { version = "0.1.0", path = "../arabica-adapters" }
arabica-model = { version = "0.1.0", path = "../arabica-model" }
arabica-protocol = { version = "0.1.0", path = "../arabica-protocol" }
arabica-provider = { version = "0.1.0", path = "../arabica-provider" }
arabica-runner = { version = "0.1.0", path = "../arabica-runner" }
arabica-runtime = { version = "0.1.0", path = "../arabica-runtime" }
arabica-session = { version = "0.1.0", path = "../arabica-session" }
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
