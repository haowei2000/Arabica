[package]
name = "arabica-cli"
description = "Arabica: a terminal coding agent with a fullscreen TUI, ACP support for Zed, and one-shot runs"
keywords = ["ai", "agent", "tui", "cli", "llm"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/arabica-cli"

[[bin]]
name = "arabica"
path = "src/main.rs"

[dependencies]
agent-client-protocol.workspace = true
rmcp.workspace = true
futures-util.workspace = true
async-trait = "0.1"
sse-stream = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rpassword = "7.5"
clap.workspace = true
crossterm = "0.29"
ignore.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "scrolling-regions", "unstable-rendered-line-info"] }
serde.workspace = true
similar.workspace = true
serde_json.workspace = true
regex.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
jsonwebtoken.workspace = true
url.workspace = true
hex.workspace = true
ed25519-dalek = "2"
flate2 = "1"
fs2.workspace = true
semver = "1"
self-replace = "1.5"
tar = "0.4"
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
toml.workspace = true
toml_edit = "0.23"
unicode-segmentation = "1.12"
unicode-width = "0.2"
arabica-adapters = { version = "0.12.0", path = "../arabica-adapters" }
arabica-model = { version = "0.12.0", path = "../arabica-model" }
arabica-protocol = { version = "0.12.0", path = "../arabica-protocol" }
arabica-provider = { version = "0.12.0", path = "../arabica-provider" }
arabica-runner = { version = "0.12.0", path = "../arabica-runner" }
arabica-runner-remote = { version = "0.12.0", path = "../arabica-runner-remote" }
arabica-runtime = { version = "0.12.0", path = "../arabica-runtime" }
arabica-session = { version = "0.12.0", path = "../arabica-session" }
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
serde-saphyr = { version = "=1.1.0", default-features = false, features = ["deserialize"] }

[dev-dependencies]
axum.workspace = true
rcgen = "0.14"

[lints]
workspace = true
