name: CI
on:
  push:
    branches: [main, develop, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    name: Rust workspace and offline experiments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: make benchmark-smoke
      - run: make test-proxy
      - name: Enforce Rust-only maintained sources
        run: test -z "$(git ls-files '*.py')"
  macos-desktop:
    name: Native macOS client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: swift test
        working-directory: apps/arabica-desktop
      - run: brew install librsvg
      - run: bash scripts/package.sh debug
        working-directory: apps/arabica-desktop
