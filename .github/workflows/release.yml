name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.2.0)'
        required: true
      publish_crates:
        description: 'Also publish the crates to crates.io'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: structure-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: structure-linux-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: structure-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: structure-macos-aarch64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: structure-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build release binary
        run: cargo build --release -p arabica-cli --bin arabica
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          dir="structure-${{ matrix.target }}"
          mkdir -p "$dir"
          cp target/${{ matrix.target }}/release/arabica "$dir/"
          cp README.md LICENSE NOTICE "$dir/"
          tar czf "${{ matrix.archive }}" "$dir"
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "structure-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/arabica.exe" $dir/
          Copy-Item README.md, LICENSE, NOTICE $dir/
          Compress-Archive -Path $dir -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash
          "$hash  ${{ matrix.archive }}" | Out-File "${{ matrix.archive }}.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  desktop:
    name: macOS desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: macos-15
          - arch: x86_64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install icon renderer
        run: brew install librsvg
      - name: Build desktop app
        working-directory: apps/arabica-desktop
        env:
          ARABICA_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bash scripts/package.sh release
      - name: Archive desktop app
        working-directory: apps/arabica-desktop/dist
        run: |
          archive="Arabica-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent Arabica.app "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Arabica-macos-${{ matrix.arch }}
          path: |
            apps/arabica-desktop/dist/Arabica-macos-${{ matrix.arch }}.zip
            apps/arabica-desktop/dist/Arabica-macos-${{ matrix.arch }}.zip.sha256

  publish-crates:
    name: Publish crates.io (dependency order)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.publish_crates == true }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # crates.io resolves versioned deps from the registry, so crates must
      # publish strictly in dependency order; arabica goes last.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          for crate in arabica-model arabica-protocol arabica-provider arabica-runner arabica-runtime arabica-session arabica-adapters arabica-server arabica-cli; do
            echo "== publishing $crate"
            out=$(cargo publish -p "$crate" 2>&1) || {
              # Only "already published" is tolerable (re-runs, or a dep that
              # hit the registry seconds ago). Anything else fails the run.
              if echo "$out" | grep -qi "already exists"; then
                echo "$crate skipped (already published)"
              else
                echo "$out"
                exit 1
              fi
            }
            sleep 10
          done

  release:
    name: Publish GitHub release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Generate release notes
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          {
            echo "## Structure $tag"
            echo
            echo "CLI binaries for Linux (x86_64, aarch64), macOS (x86_64, Apple silicon) and Windows (x86_64)."
            echo "The Arabica macOS desktop app is available for Apple silicon and Intel Macs."
            echo "Desktop archives are currently unsigned and are not notarized."
            echo "Verify with the \`.sha256\` sidecar files."
            echo
            echo "### Changes"
            echo
            git log --format='- %s' "$(git tag --sort=-creatordate | sed -n 2p)..$tag" 2>/dev/null || git log --format='- %s' -20
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
