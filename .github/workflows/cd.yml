name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/structure

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: docker/Dockerfile
            image_suffix: backend
            build_args: |
              PYTHON_VERSION=3.12
              UV_VERSION=0.5.24

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Sync config files to match remote (force overwrite local changes)
            git fetch origin main
            git reset --hard origin/main

            # Log in to GitHub Container Registry
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            SHA=$(echo ${{ github.sha }} | cut -c1-7)
            BACKEND=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:sha-$SHA
            docker pull $BACKEND

            # Tag as local names used by docker-compose
            docker tag $BACKEND structure-service:latest

            # Inline of `make docker-deploy` (avoids depending on `make`
            # being installed on the deploy host).
            docker ps -aq --filter "network=structure-network" | xargs -r docker rm -f || true
            docker network rm structure-network || true
            docker compose -p structure -f docker/docker-compose.yml --env-file "$(pwd)/.env" --env-file "$(pwd)/performance.env" up -d --no-build
            docker compose -p structure -f docker/docker-compose.yml --env-file "$(pwd)/.env" --env-file "$(pwd)/performance.env" run --rm tool-initializer || true
            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 3; done'
            echo "Deployment successful"
