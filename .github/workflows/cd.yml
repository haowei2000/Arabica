name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: docker/Dockerfile
            image_suffix: backend
            build_args: |
              PYTHON_VERSION=${{ env.PYTHON_VERSION }}
              UV_VERSION=${{ env.UV_VERSION }}
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
            image_suffix: frontend
            build_args: ""
          - name: context-service
            dockerfile: docker/Dockerfile.context-service
            image_suffix: context-service
            build_args: ""

    outputs:
      backend_image: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images (sha tag is deterministic from git sha)
            BACKEND=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:sha-$(echo ${{ github.sha }} | cut -c1-7)
            FRONTEND=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:sha-$(echo ${{ github.sha }} | cut -c1-7)
            CONTEXT=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/context-service:sha-$(echo ${{ github.sha }} | cut -c1-7)
            docker pull $BACKEND
            docker pull $FRONTEND
            docker pull $CONTEXT

            # Tag as local names used by docker-compose
            docker tag $BACKEND structure-service:latest
            docker tag $FRONTEND structure-frontend:latest
            docker tag $CONTEXT structure-context-service:latest

            # Start infra if not running, restart backend + frontend
            docker compose --env-file docker/.env --profile infra up -d --no-build
            docker compose --env-file docker/.env --profile app up -d --no-build --force-recreate

            # Run tool initializer
            docker compose --env-file docker/.env run --rm tool-initializer || true

            # Clean up unused images
            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose --env-file docker/.env ps
            # Wait for app health check
            timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 3; done'
            echo "Deployment successful - app is healthy"
